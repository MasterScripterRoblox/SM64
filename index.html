<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario 64 - Joystick Pocket 🕹️</title>
    <link rel="icon" type="x-icon" href="images/favicon.ico">
    <style>
        /* ── Reset & Base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        ::-webkit-scrollbar {
            display: none;
        }

        /* ── Console Shell ── */
        .console {
            position: relative;
            width: 96vw;
            max-width: 820px;
            height: 96vh;
            max-height: 720px;
            background: linear-gradient(145deg, #2d2d44, #1a1a2e);
            border-radius: 36px;
            padding: 14px 14px 16px 14px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 2px 0 rgba(255, 255, 255, 0.06), 0 0 0 2px #3a3a55;
            display: flex;
            flex-direction: column;
            transition: all 0.2s;
        }
        .console::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 38px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.08), transparent 40%, transparent 60%, rgba(100, 200, 255, 0.08));
            z-index: 0;
            pointer-events: none;
        }

        /* ── Screen Area ── */
        .screen-wrap {
            position: relative;
            flex: 0 0 auto;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #0a0a12;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9), 0 4px 20px rgba(0, 0, 0, 0.6);
            border: 2px solid #22223a;
            z-index: 1;
        }
        .screen-wrap canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            image-rendering: auto;
            background: #000;
        }
        .screen-wrap::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, transparent 40%, transparent 70%, rgba(255, 255, 255, 0.02) 100%);
            pointer-events: none;
            border-radius: 18px;
        }

        /* ── Controls Area ── */
        .controls {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 10px 4px 2px 4px;
            gap: 6px;
            z-index: 1;
            position: relative;
        }

        /* shoulder buttons row */
        .shoulder-row {
            display: flex;
            justify-content: space-between;
            padding: 0 6px;
            gap: 12px;
            flex: 0 0 auto;
        }
        .shoulder-btn {
            flex: 0 0 72px;
            height: 28px;
            border-radius: 20px 20px 8px 8px;
            border: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.06s ease;
            cursor: pointer;
            touch-action: none;
            position: relative;
        }
        .shoulder-btn:active,
        .shoulder-btn.active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
        }
        .shoulder-btn.l {
            background: linear-gradient(145deg, #5b7fbf, #3a5a8f);
            border-bottom: 3px solid #2a4a7a;
        }
        .shoulder-btn.r {
            background: linear-gradient(145deg, #bf7b5b, #8f5a3a);
            border-bottom: 3px solid #7a4a2a;
        }
        .shoulder-btn span {
            display: block;
            margin-top: -1px;
        }

        /* ── Main grid: joysticks + buttons ── */
        .btn-grid {
            display: flex;
            flex: 1 1 auto;
            min-height: 0;
            gap: 6px;
            align-items: stretch;
            padding: 0 2px;
        }

        /* ── Joystick common ── */
        .joystick-wrap {
            flex: 0 0 38%;
            max-width: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            position: relative;
        }
        .joystick-base {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 130px;
            max-height: 130px;
            background: radial-gradient(circle at 40% 40%, #3d3d5c, #1e1e34);
            border-radius: 50%;
            box-shadow: inset 0 -6px 0 #0e0e1a, 0 6px 12px rgba(0, 0, 0, 0.6);
            border: 2px solid #2a2a44;
            touch-action: none;
            cursor: grab;
        }
        .joystick-base:active {
            cursor: grabbing;
        }
        .joystick-thumb {
            position: absolute;
            width: 44%;
            height: 44%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at 40% 35%, #a0a0c0, #4a4a6a);
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5), inset 0 -2px 4px rgba(0, 0, 0, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.2);
            border: 1px solid #666688;
            pointer-events: none;
            transition: none;
            will-change: transform;
        }
        .joystick-label {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        /* ── Center buttons (A/B/Z/Start) ── */
        .abz-wrap {
            flex: 0 0 24%;
            max-width: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 2px;
        }
        .ab-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .ab-btn {
            border: none;
            border-radius: 50%;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3), inset 0 -2px 4px rgba(0, 0, 0, 0.15), inset 0 2px 4px rgba(255, 255, 255, 0.25);
            transition: all 0.05s ease;
            cursor: pointer;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            aspect-ratio: 1 / 1;
            width: 48px;
        }
        .ab-btn:active,
        .ab-btn.active {
            transform: scale(0.92);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
        }
        .ab-btn.a {
            background: radial-gradient(circle at 40% 35%, #81c784, #388e3c);
            width: 58px;
            font-size: 22px;
        }
        .ab-btn.b {
            background: radial-gradient(circle at 40% 35%, #ef9a9a, #c62828);
            width: 48px;
            font-size: 18px;
        }
        .z-btn {
            border: none;
            border-radius: 30px;
            padding: 4px 22px;
            font-weight: 700;
            font-size: 12px;
            color: #fff;
            background: radial-gradient(circle at 40% 35%, #ce93d8, #7b1fa2);
            box-shadow: 0 3px 0 #4a148c, inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.05s ease;
            cursor: pointer;
            touch-action: none;
            letter-spacing: 0.5px;
        }
        .z-btn:active,
        .z-btn.active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #4a148c;
        }
        .start-btn {
            background: linear-gradient(145deg, #6a6a8a, #4a4a6a);
            border: none;
            border-radius: 20px;
            padding: 4px 16px;
            font-size: 10px;
            font-weight: 700;
            color: #ccc;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            box-shadow: 0 3px 0 #2a2a44, inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.05s ease;
            cursor: pointer;
            touch-action: none;
            letter-spacing: 1px;
            margin-top: 2px;
        }
        .start-btn:active,
        .start-btn.active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #2a2a44;
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .console {
                border-radius: 20px;
                padding: 8px 8px 10px 8px;
                max-height: 100vh;
                height: 100vh;
                width: 100vw;
                max-width: 100vw;
            }
            .screen-wrap {
                border-radius: 12px;
            }
            .shoulder-btn {
                flex: 0 0 52px;
                height: 22px;
                font-size: 9px;
            }
            .ab-btn {
                width: 38px !important;
                font-size: 14px !important;
            }
            .ab-btn.a {
                width: 46px !important;
                font-size: 18px !important;
            }
            .z-btn {
                padding: 2px 14px;
                font-size: 10px;
            }
            .start-btn {
                padding: 2px 12px;
                font-size: 8px;
            }
            .joystick-wrap {
                flex: 0 0 34%;
            }
            .abz-wrap {
                flex: 0 0 32%;
            }
            .controls {
                padding: 6px 2px 0 2px;
                gap: 4px;
            }
            .btn-grid {
                gap: 4px;
            }
        }
        @media (max-width: 420px) {
            .shoulder-btn {
                flex: 0 0 40px;
                height: 18px;
                font-size: 7px;
                border-radius: 12px 12px 4px 4px;
            }
            .ab-btn {
                width: 30px !important;
                font-size: 11px !important;
            }
            .ab-btn.a {
                width: 38px !important;
                font-size: 14px !important;
            }
            .z-btn {
                padding: 2px 10px;
                font-size: 8px;
            }
            .start-btn {
                padding: 2px 10px;
                font-size: 7px;
            }
            .joystick-wrap {
                flex: 0 0 32%;
            }
            .abz-wrap {
                flex: 0 0 36%;
            }
            .controls {
                padding: 4px 0 0 0;
                gap: 2px;
            }
            .btn-grid {
                gap: 2px;
            }
            .shoulder-row {
                padding: 0 2px;
                gap: 6px;
            }
        }

        /* ── Instructions toggle ── */
        .instructions-toggle {
            position: fixed;
            bottom: 12px;
            right: 12px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            color: #aaa;
            border: 1px solid #444;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 11px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            font-family: inherit;
            transition: all 0.2s;
        }
        .instructions-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .instructions-panel {
            position: fixed;
            bottom: 60px;
            right: 12px;
            z-index: 99;
            background: rgba(10, 10, 20, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid #333355;
            border-radius: 16px;
            padding: 16px 20px;
            color: #ccc;
            font-size: 12px;
            max-width: 280px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
            pointer-events: auto;
            line-height: 1.6;
        }
        .instructions-panel.hidden {
            opacity: 0;
            transform: translateY(20px) scale(0.96);
            pointer-events: none;
        }
        .instructions-panel h4 {
            margin: 0 0 6px 0;
            color: #ffd54f;
            font-weight: 600;
            font-size: 14px;
        }
        .instructions-panel kbd {
            background: #2a2a44;
            padding: 1px 8px;
            border-radius: 4px;
            font-size: 10px;
            color: #ddd;
            border: 1px solid #444466;
            font-family: inherit;
        }
        .instructions-panel .close-instr {
            float: right;
            background: none;
            border: none;
            color: #888;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            margin-top: -4px;
        }
        .instructions-panel .close-instr:hover {
            color: #fff;
        }

        /* ── Loading ── */
        #status-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            pointer-events: none;
            z-index: 2;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: 1px;
        }
        #status-msg span {
            display: block;
            font-size: 28px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <!-- ─── INSTRUCTIONS TOGGLE ─── -->
    <button class="instructions-toggle" id="toggleInstrBtn">🎮 Controls</button>
    <div class="instructions-panel hidden" id="instrPanel">
        <button class="close-instr" id="closeInstr">✕</button>
        <h4>🕹️ Joystick Pocket Controls</h4>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:2px 16px; font-size:11px;">
            <span><kbd>Left Stick</kbd> WASD</span>
            <span><kbd>Right Stick</kbd> Arrows</span>
            <span><kbd>A</kbd> L</span>
            <span><kbd>B</kbd> ,</span>
            <span><kbd>Z</kbd> K</span>
            <span><kbd>L</kbd> .</span>
            <span><kbd>R</kbd> Shift</span>
            <span><kbd>Start</kbd> Space</span>
        </div>
        <div style="margin-top:6px; font-size:10px; color:#666; border-top:1px solid #333; padding-top:6px;">
            Drag sticks • Click/tap buttons • Keyboard also works
        </div>
    </div>

    <!-- ─── CONSOLE ─── -->
    <div class="console" id="console">

        <!-- Screen -->
        <div class="screen-wrap" id="screenWrap">
            <div id="status-msg"><span>⏳</span>Loading…</div>
            <canvas class="emscripten" id="canvas"></canvas>
        </div>

        <!-- Controls -->
        <div class="controls">

            <!-- Shoulder Buttons -->
            <div class="shoulder-row">
                <button class="shoulder-btn l" data-key="." data-code="Period"><span>L</span></button>
                <button class="shoulder-btn r" data-key="Shift" data-code="ShiftLeft"><span>R</span></button>
            </div>

            <!-- Main Grid: two joysticks + buttons -->
            <div class="btn-grid">

                <!-- Left Joystick (WASD) -->
                <div class="joystick-wrap" id="leftStickWrap">
                    <div class="joystick-base" id="leftStickBase">
                        <div class="joystick-thumb" id="leftThumb"></div>
                        <div class="joystick-label">MOVE</div>
                    </div>
                </div>

                <!-- Center: A, B, Z, Start -->
                <div class="abz-wrap">
                    <div class="ab-row">
                        <button class="ab-btn b" data-key="," data-code="Comma">B</button>
                        <button class="ab-btn a" data-key="l" data-code="KeyL">A</button>
                    </div>
                    <button class="z-btn" data-key="k" data-code="KeyK">Z</button>
                    <button class="start-btn" data-key=" " data-code="Space">START</button>
                </div>

                <!-- Right Joystick (Arrow keys) -->
                <div class="joystick-wrap" id="rightStickWrap">
                    <div class="joystick-base" id="rightStickBase">
                        <div class="joystick-thumb" id="rightThumb"></div>
                        <div class="joystick-label">CAMERA</div>
                    </div>
                </div>

            </div><!-- /btn-grid -->
        </div><!-- /controls -->
    </div><!-- /console -->


    <!-- ─── SCRIPT: Game Loader ─── -->
    <script type='text/javascript'>
        // ── Module config ──
        var Module = {
            preRun: [],
            postRun: [],
            print: (function() {
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    var st = document.getElementById('status-msg');
                    if (st && text && text.includes('Game')) st.style.display = 'none';
                };
            })(),
            printErr: function(text) {
                if (arguments.length > 1)
                    text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
            },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.width = 640;
                canvas.height = 480;
                canvas.addEventListener("webglcontextlost", function(e) {
                    alert('WebGL context lost. You will need to reload the page.');
                    e.preventDefault();
                }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                var st = document.getElementById('status-msg');
                if (st) {
                    if (text && text.length) {
                        st.innerHTML = '<span>⏳</span>' + text;
                        st.style.display = 'block';
                    } else {
                        st.style.display = 'none';
                    }
                }
            }
        };

        // ── Load the game ──
        var script = document.createElement('script');
        script.async = true;
        script.type = 'text/javascript';
        script.src = 'game/sm64.us.f3dex2e.js';
        document.head.appendChild(script);

        // hide status after timeout (fallback)
        setTimeout(function() {
            var st = document.getElementById('status-msg');
            if (st) st.style.display = 'none';
        }, 8000);
    </script>


    <!-- ─── SCRIPT: Joystick & Button Controller ─── -->
    <script>
        (function() {
            'use strict';

            // ── Joystick Helpers ──
            function setupJoystick(baseId, thumbId, keyMap) {
                var base = document.getElementById(baseId);
                var thumb = document.getElementById(thumbId);
                if (!base || !thumb) return;

                var rect = base.getBoundingClientRect();
                var radius = rect.width / 2;
                var centerX = radius;
                var centerY = radius;
                var maxDist = radius * 0.7; // deadzone and max travel
                var deadZone = 8; // pixels

                // current state
                var active = false;
                var touchId = null;
                var currentX = 0,
                    currentY = 0; // normalized -1..1

                // key states
                var keys = keyMap; // e.g. { up: 'w', down: 's', left: 'a', right: 'd' }

                function updateKeys(dx, dy) {
                    // dx, dy in -1..1
                    var threshold = 0.2; // deadzone
                    var up = dy < -threshold;
                    var down = dy > threshold;
                    var left = dx < -threshold;
                    var right = dx > threshold;

                    // release all first
                    releaseKey(keys.up);
                    releaseKey(keys.down);
                    releaseKey(keys.left);
                    releaseKey(keys.right);

                    // press active ones
                    if (up) pressKey(keys.up);
                    if (down) pressKey(keys.down);
                    if (left) pressKey(keys.left);
                    if (right) pressKey(keys.right);
                }

                function setPosition(clientX, clientY) {
                    var rect = base.getBoundingClientRect();
                    var px = clientX - rect.left - rect.width / 2;
                    var py = clientY - rect.top - rect.height / 2;
                    var dist = Math.sqrt(px * px + py * py);
                    var max = rect.width / 2 * 0.7;
                    var angle = Math.atan2(py, px);

                    // clamp
                    if (dist > max) {
                        px = Math.cos(angle) * max;
                        py = Math.sin(angle) * max;
                        dist = max;
                    }

                    // deadzone
                    if (dist < deadZone) {
                        px = 0;
                        py = 0;
                    }

                    // update thumb position
                    thumb.style.transform = 'translate(calc(-50% + ' + px + 'px), calc(-50% + ' + py + 'px))';

                    // normalize
                    var normX = px / max;
                    var normY = py / max;
                    if (dist < deadZone) {
                        normX = 0;
                        normY = 0;
                    }
                    currentX = normX;
                    currentY = normY;

                    // send keys
                    updateKeys(normX, normY);
                }

                function reset() {
                    thumb.style.transform = 'translate(-50%, -50%)';
                    currentX = 0;
                    currentY = 0;
                    updateKeys(0, 0);
                    active = false;
                    touchId = null;
                }

                // ── Events ──
                function handleStart(clientX, clientY, id) {
                    active = true;
                    touchId = id;
                    setPosition(clientX, clientY);
                }

                function handleMove(clientX, clientY, id) {
                    if (active && (id === touchId || touchId === null)) {
                        setPosition(clientX, clientY);
                    }
                }

                function handleEnd(id) {
                    if (id === touchId || touchId === null) {
                        reset();
                    }
                }

                // Mouse events
                base.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    handleStart(e.clientX, e.clientY, null);
                });
                window.addEventListener('mousemove', function(e) {
                    if (active) {
                        handleMove(e.clientX, e.clientY, null);
                    }
                });
                window.addEventListener('mouseup', function(e) {
                    if (active) {
                        handleEnd(null);
                    }
                });

                // Touch events
                base.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    var touch = e.changedTouches[0];
                    handleStart(touch.clientX, touch.clientY, touch.identifier);
                }, { passive: false });

                window.addEventListener('touchmove', function(e) {
                    if (!active) return;
                    for (var i = 0; i < e.changedTouches.length; i++) {
                        var touch = e.changedTouches[i];
                        if (touch.identifier === touchId || touchId === null) {
                            handleMove(touch.clientX, touch.clientY, touch.identifier);
                            break;
                        }
                    }
                }, { passive: false });

                window.addEventListener('touchend', function(e) {
                    if (!active) return;
                    for (var i = 0; i < e.changedTouches.length; i++) {
                        var touch = e.changedTouches[i];
                        if (touch.identifier === touchId || touchId === null) {
                            handleEnd(touch.identifier);
                            break;
                        }
                    }
                }, { passive: false });

                window.addEventListener('touchcancel', function(e) {
                    if (active) reset();
                }, { passive: false });

                // ── Keyboard simulation helpers ──
                function pressKey(key) {
                    if (!key) return;
                    var ev = new KeyboardEvent('keydown', { key: key, code: key, bubbles: true });
                    document.dispatchEvent(ev);
                    var canvas = document.getElementById('canvas');
                    if (canvas) canvas.dispatchEvent(ev);
                }

                function releaseKey(key) {
                    if (!key) return;
                    var ev = new KeyboardEvent('keyup', { key: key, code: key, bubbles: true });
                    document.dispatchEvent(ev);
                    var canvas = document.getElementById('canvas');
                    if (canvas) canvas.dispatchEvent(ev);
                }

                // Expose reset for cleanup
                return {
                    reset: reset
                };
            }

            // ── Setup both joysticks ──
            var leftStick = setupJoystick('leftStickBase', 'leftThumb', {
                up: 'w',
                down: 's',
                left: 'a',
                right: 'd'
            });
            var rightStick = setupJoystick('rightStickBase', 'rightThumb', {
                up: 'ArrowUp',
                down: 'ArrowDown',
                left: 'ArrowLeft',
                right: 'ArrowRight'
            });

            // ── Buttons (reuse from original) ──
            function sendKeyEvent(type, key, code) {
                if (!key && key !== ' ') return;
                var actualKey = key;
                var actualCode = code || key;
                if (key === ' ') { actualKey = ' ';
                    actualCode = 'Space'; }
                if (key === '.') { actualKey = '.';
                    actualCode = 'Period'; }
                if (key === ',') { actualKey = ',';
                    actualCode = 'Comma'; }
                if (key === 'Shift') { actualKey = 'Shift';
                    actualCode = 'ShiftLeft'; }
                var eventOptions = {
                    key: actualKey,
                    code: actualCode,
                    bubbles: true,
                    cancelable: true,
                    view: window,
                    composed: true
                };
                var ev = new KeyboardEvent(type, eventOptions);
                document.dispatchEvent(ev);
                var canvas = document.getElementById('canvas');
                if (canvas) canvas.dispatchEvent(ev);
            }

            function pressKey(key, code) { sendKeyEvent('keydown', key, code); }

            function releaseKey(key, code) { sendKeyEvent('keyup', key, code); }

            // Attach to all buttons (shoulder, A, B, Z, Start)
            var buttons = document.querySelectorAll('.shoulder-btn, .ab-btn, .z-btn, .start-btn');
            buttons.forEach(function(btn) {
                var key = btn.getAttribute('data-key');
                var code = btn.getAttribute('data-code') || key;

                btn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    this.classList.add('active');
                    pressKey(key, code);
                }, { passive: false });
                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    this.classList.remove('active');
                    releaseKey(key, code);
                }, { passive: false });
                btn.addEventListener('touchcancel', function(e) {
                    this.classList.remove('active');
                    releaseKey(key, code);
                }, { passive: false });

                btn.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    this.classList.add('active');
                    pressKey(key, code);
                });
                btn.addEventListener('mouseup', function(e) {
                    e.preventDefault();
                    this.classList.remove('active');
                    releaseKey(key, code);
                });
                btn.addEventListener('mouseleave', function(e) {
                    if (this.classList.contains('active')) {
                        this.classList.remove('active');
                        releaseKey(key, code);
                    }
                });
                btn.addEventListener('pointerdown', function(e) {
                    e.preventDefault();
                }, { passive: false });
            });

            // ── Instructions Toggle ──
            var toggleBtn = document.getElementById('toggleInstrBtn');
            var instrPanel = document.getElementById('instrPanel');
            var closeInstr = document.getElementById('closeInstr');

            function toggleInstr(show) {
                if (show === undefined) {
                    instrPanel.classList.toggle('hidden');
                } else if (show) {
                    instrPanel.classList.remove('hidden');
                } else {
                    instrPanel.classList.add('hidden');
                }
                toggleBtn.textContent = instrPanel.classList.contains('hidden') ? '🎮 Controls' : '✕ Close';
            }
            toggleBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleInstr();
            });
            closeInstr.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleInstr(false);
            });
            document.addEventListener('click', function(e) {
                if (!instrPanel.classList.contains('hidden')) {
                    var target = e.target;
                    if (!instrPanel.contains(target) && target !== toggleBtn) {
                        toggleInstr(false);
                    }
                }
            });
            document.addEventListener('keydown', function(e) {
                if (e.altKey && e.key === 'ArrowUp') {
                    e.preventDefault();
                    toggleInstr();
                }
            });

            console.log('🕹️ Joystick Pocket Console ready!');
        })();
    </script>

</body>
</html>
